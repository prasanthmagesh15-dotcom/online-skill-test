<!DOCTYPE html>
<html>
<head>
  <title>Create Account</title>
  <style>
    body{font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#e9e9e9;margin:0}
    .box{background:white;padding:30px;border-radius:10px;box-shadow:0 0 10px #aaa;width:400px}
    .row{display:flex;align-items:center;margin-bottom:15px}
    .row label{width:150px;font-weight:bold;font-size:14px}
    .row input{flex:1;padding:10px;border-radius:5px;border:1px solid #ccc}
    .btn{width:100%;padding:12px;border:none;border-radius:5px;color:white;background:#1a5cff;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
<div class="box">
  <h2>Create Account</h2>
  <form action="/register" method="POST">
    {% if error %}
    <div style="color:red; background:#ffe0e0; padding:10px; border-radius:5px; margin-bottom:15px; text-align:center; font-weight:bold;">{{ error }}</div>
    {% endif %}
    <div class="row"><label>UserName</label><input type="text" name="username" required></div>
    <div class="row"><label>Phone Number</label><input type="text" name="number" required></div>
    <div class="row"><label>Password</label><input type="password" name="password" placeholder="Atleast 5" required></div>
    <div class="row"><label>Confirm Password</label><input type="password" name="cpassword" required></div>
    <button class="btn">Create</button>
  </form>
  <p style="margin-top:15px;font-size:14px">If You Already Have Account-> <a href="/login">Login</a></p>
</div>
</body>
</html>
